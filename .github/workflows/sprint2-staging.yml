name: Sprint 2 DB validation and Staging readiness

on:
  push:
    paths: ['database/**', 'scripts/**', 'backend/**', 'frontend/**', 'Sprint 2/**', '.github/workflows/sprint2-staging.yml']
  pull_request:
    paths: ['database/**', 'scripts/**', 'backend/**', 'frontend/**', 'Sprint 2/**', '.github/workflows/sprint2-staging.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-db-and-concurrency:
    name: PostgreSQL 16 regression, ACL and two POS sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sasms_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: sasms_sprint2_validation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sasms_ci -d sasms_sprint2_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: sasms_ci
      PGPASSWORD: isolated-ci-only
      PGDATABASE: sasms_sprint2_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply and verify Sprint 0, 1 and 2
        run: |
          set -euo pipefail
          python scripts/validate_sprint2.py --apply --evidence-dir /tmp/sasms-sprint2-evidence
      - name: Preserve actual validation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-db-concurrency-evidence
          path: /tmp/sasms-sprint2-evidence/
          if-no-files-found: warn

  staging-readiness:
    name: Record Staging readiness from actual validation result
    needs: validate-db-and-concurrency
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate readiness report
        env:
          DB_RESULT: ${{ needs.validate-db-and-concurrency.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sasms-staging-readiness
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          result = os.environ['DB_RESULT']
          status = {'success': 'READY_FOR_STAGING', 'failure': 'FAILED',
                    'cancelled': 'CANCELLED', 'skipped': 'BLOCKED'}[result]
          report = {
              'status': status,
              'db_validation_result': result,
              'deployment_status': 'NOT_DEPLOYED',
              'scope': 'Isolated PostgreSQL validation; no remote deployment or application health check',
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/sasms-staging-readiness/readiness-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(status)
          raise SystemExit(0 if result == 'success' else 1)
          PY
      - name: Preserve readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-staging-readiness
          path: /tmp/sasms-staging-readiness/
