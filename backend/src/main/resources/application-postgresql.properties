# Activate explicitly with: --spring.profiles.active=postgresql
# Credentials must come from the local environment or an external secret store.
spring.datasource.url=${SASMS_DB_URL:jdbc:postgresql://127.0.0.1:5432/sasms}
spring.datasource.username=${SASMS_DB_USERNAME}
spring.datasource.password=${SASMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# D64 does not initialize, create, update, or drop the Kiên schema automatically.
spring.sql.init.mode=never
