spring.application.name=smart-electronic-supermarket-pos-skeleton
server.port=8080

# Optional JWT Resource Server configuration. With all values empty, only the
# three explicit status endpoints are public and every other route fails closed.
sasms.jwt.issuer=${SASMS_JWT_ISSUER:}
sasms.jwt.audience=${SASMS_JWT_AUDIENCE:}
sasms.jwt.jwks-uri=${SASMS_JWT_JWKS_URI:}

# Proposed order-first Serial API. Disabled until D52 and V003-V005 are merged
# and BA/Architect approve the contract recorded in the Sprint 2 TV4 change request.
sasms.features.pos-serial-api.enabled=false

# Proposed order-first Order & Reserve API. Disabled until D52 and V003-V005 are merged
# and BA/Architect approve the contract recorded in the Sprint 2 TV4 change request.
sasms.features.pos-order-api.enabled=false

# Proposed server-side Cash Payment & Complete Sale API. Disabled until BA/Architect/PM
# approve the cash payment method and runtime integration.
sasms.features.pos-cash-payment-api.enabled=false

# Proposed Sprint 3 Logistics API. Disabled until PR #37 (V006/V007) is merged
# and D52/Architect approve the HTTP contract. Authentication always uses the
# trusted internal actor resolved from the verified JWT.
sasms.features.logistics-api.enabled=false
