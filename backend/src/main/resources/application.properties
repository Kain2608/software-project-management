spring.application.name=smart-electronic-supermarket-pos-skeleton
server.port=8080

# Optional JWT Resource Server configuration. With all values empty, only the
# three explicit status endpoints are public and every other route fails closed.
sasms.jwt.issuer=${SASMS_JWT_ISSUER:}
sasms.jwt.audience=${SASMS_JWT_AUDIENCE:}
sasms.jwt.jwks-uri=${SASMS_JWT_JWKS_URI:}
